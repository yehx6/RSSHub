services:
  rsshub:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: never
    image: rsshub-local:latest
    entrypoint: ["npm", "run", "start"]
    restart: always
    ports:
      - "127.0.0.1:1200:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/
      PUPPETEER_WS_ENDPOINT: ws://browserless:3000
      PUPPETEER_REAL_BROWSER_SERVICE: http://real-browser:3000
      CACHE_EXPIRE: 1800
      CACHE_CONTENT_EXPIRE: 3600
      PROXY_URI: http://host.docker.internal:7897
      PROXY_STRATEGY: on_retry
      REQUEST_TIMEOUT: 15000
      YOUTUBE_KEY: AIzaSyDMvEzH9yGKZAv5HG0huYnOxZGd3RK8760
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis
      - browserless
      - real-browser

  real-browser:
    image: ghcr.io/hyoban/puppeteer-real-browser-hono
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  browserless:
    image: browserless/chrome
    restart: always
    ulimits:
      core:
        hard: 0
        soft: 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/pressure"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s

volumes:
  redis-data:
